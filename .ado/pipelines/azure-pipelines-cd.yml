# Azure Pipelines definition name: Polyfills - CD
trigger: none
pr: none

parameters:
- name: validationMode
  displayName: Validate artifacts without external publication
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

resources:
  pipelines:
  - pipeline: releaseBuild
    source: Polyfills - CD Build
    # Manual Run Pipeline selection may intentionally override this default.
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main
      stages:
      - BuildArtifacts
  repositories:
  - repository: polyfillsPipelines
    type: git
    name: open-source/PolyfillsPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: OneESPool
      image: HostedPoolLinuxImage
      os: linux
    sdl:
      sourceAnalysisPool:
        name: OneESPool
        image: HostedPoolWindowsImage
        os: windows
    settings:
      networkIsolationPolicy: Permissive
      networkIsolationAdditionalDomainAllowList: registry.npmjs.org
    stages:
    - stage: ValidateArtifacts
      displayName: Validate release artifacts
      jobs:
      - job: Validate
        displayName: Validate release artifacts
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          fetchTags: false

        - task: UseNode@1
          displayName: Install Node.js
          inputs:
            version: 24.x

        - download: releaseBuild
          artifact: release-metadata
          displayName: Download release metadata

        - download: releaseBuild
          artifact: npm_packages
          displayName: Download npm packages

        - task: Bash@3
          name: release
          displayName: Validate release metadata and packages
          inputs:
            targetType: inline
            script: node build/scripts/validate-release-artifacts.mjs
          env:
            AZURE_BUILD_ID: $(Build.BuildId)
            EXPECTED_RELEASE_COMMIT: $(resources.pipeline.releaseBuild.sourceCommit)
            EXPECTED_VALIDATION_MODE: ${{ parameters.validationMode }}
            RELEASE_ARTIFACT_DIR: $(Pipeline.Workspace)/releaseBuild/npm_packages
            RELEASE_MANIFEST_PATH: $(Pipeline.Workspace)/releaseBuild/release-metadata/release-manifest.json

    - ${{ if eq(parameters.validationMode, 'false') }}:
      - stage: TagRelease
        displayName: Tag releases
        dependsOn: ValidateArtifacts
        variables:
          releaseCommit: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.releaseCommit'] ]
          releaseTags: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.releaseTags'] ]
        jobs:
        - job: Tag
          displayName: Create release tags
          steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false
            persistCredentials: true

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.x

          - task: Bash@3
            displayName: Create annotated release tags
            inputs:
              targetType: inline
              script: node build/scripts/manage-release-tags.mjs create
            env:
              RELEASE_COMMIT: $(releaseCommit)
              RELEASE_TAGS: $(releaseTags)

      - stage: PublishRelease
        displayName: Publish npm and GitHub releases
        dependsOn:
        - ValidateArtifacts
        - TagRelease
        variables:
          releaseCommit: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.releaseCommit'] ]
          releaseTags: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.releaseTags'] ]
          focusgroupPolyfillIncluded: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.focusgroupPolyfillIncluded'] ]
          focusgroupPolyfillReleaseTag: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.focusgroupPolyfillReleaseTag'] ]
          focusgroupPolyfillReleaseAsset: $[ stageDependencies.ValidateArtifacts.Validate.outputs['release.focusgroupPolyfillReleaseAsset'] ]
        jobs:
        - job: PublishNpm
          displayName: Publish npm packages
          steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false

          - download: releaseBuild
            artifact: npm_packages
            displayName: Download npm packages

          - task: CopyFiles@2
            displayName: Stage npm packages
            inputs:
              SourceFolder: $(Pipeline.Workspace)/releaseBuild/npm_packages
              Contents: '*.tgz'
              TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_npm
              CleanTargetFolder: true

          - template: Polyfills.Release.PipelineTemplate.yml@polyfillsPipelines

        - job: MarkDeployed
          displayName: Mark npm publication complete
          dependsOn: PublishNpm
          condition: succeeded()
          steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false
            persistCredentials: true

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.x

          - task: Bash@3
            displayName: Mark releases as deployed
            inputs:
              targetType: inline
              script: node build/scripts/manage-release-tags.mjs mark-deployed
            env:
              RELEASE_COMMIT: $(releaseCommit)
              RELEASE_TAGS: $(releaseTags)

        - job: PublishGitHub
          displayName: Publish GitHub Releases
          dependsOn: MarkDeployed
          condition: succeeded()
          steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            fetchTags: false

          - download: releaseBuild
            artifact: npm_packages
            displayName: Download npm packages

          - download: releaseBuild
            artifact: release-metadata
            displayName: Download release metadata

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: 24.x

          - task: Bash@3
            name: releaseCheck
            displayName: Check existing GitHub Releases
            inputs:
              targetType: inline
              script: node build/scripts/check-github-releases.mjs
            env:
              RELEASE_MANIFEST_PATH: $(Pipeline.Workspace)/releaseBuild/release-metadata/release-manifest.json

          - task: GitHubRelease@1
            displayName: "Create @microsoft/focusgroup-polyfill GitHub Release"
            condition: and(succeeded(), eq(variables['focusgroupPolyfillIncluded'], 'true'), eq(variables['releaseCheck.focusgroupPolyfillGitHubReleaseExists'], 'false'))
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/polyfills
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(focusgroupPolyfillReleaseTag)
              title: $(focusgroupPolyfillReleaseTag)
              releaseNotesSource: inline
              releaseNotesInline: 'Release for @microsoft/focusgroup-polyfill. The attached npm tarball is published by this Azure pipeline.'
              addChangeLog: false
              assets: |
                $(Pipeline.Workspace)/releaseBuild/npm_packages/$(focusgroupPolyfillReleaseAsset)
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy
