# Azure Pipelines definition name: Polyfills - CD Build
# Referenced by azure-pipelines-cd.yml through resources.pipelines.source.
trigger:
  branches:
    include:
    - main
pr: none

parameters:
- name: validationMode
  displayName: Rebuild existing releases for artifact validation
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

stages:
- stage: PrepareRelease
  displayName: Prepare release
  jobs:
  - job: SelectRelease
    displayName: Select releases
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
      fetchTags: true

    - task: UseNode@1
      displayName: Install Node.js
      inputs:
        version: 24.x

    - script: npm run prepare-release-artifacts -- --check-only
      name: release
      displayName: Detect package versions without release tags
      env:
        VALIDATION_MODE: ${{ parameters.validationMode }}

- ${{ if eq(parameters.validationMode, 'false') }}:
  - stage: BuildArtifacts
    displayName: Build release artifacts
    dependsOn: PrepareRelease
    condition: |
      and(
        succeeded(),
        eq(dependencies.PrepareRelease.outputs['SelectRelease.release.shouldBuild'], 'true')
      )
    variables:
      npm_config_cache: $(Pipeline.Workspace)/.npm
      releaseTags: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.releaseTags'] ]
    jobs:
    - job: BuildAndPack
      displayName: Build and pack npm packages
      pool:
        vmImage: ubuntu-latest
      steps:
      - template: templates/pack-release-steps.yml
        parameters:
          validationMode: ${{ parameters.validationMode }}

- ${{ if eq(parameters.validationMode, 'true') }}:
  - stage: ValidateArtifacts
    displayName: Build artifacts for validation
    dependsOn: PrepareRelease
    condition: |
      and(
        succeeded(),
        eq(dependencies.PrepareRelease.outputs['SelectRelease.release.shouldBuild'], 'true')
      )
    variables:
      npm_config_cache: $(Pipeline.Workspace)/.npm
      releaseTags: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.releaseTags'] ]
    jobs:
    - job: BuildAndPack
      displayName: Build and pack npm packages for validation
      pool:
        vmImage: ubuntu-latest
      steps:
      - template: templates/pack-release-steps.yml
        parameters:
          validationMode: ${{ parameters.validationMode }}
