trigger: none
pr: none

schedules:
- cron: '0 9 * * *'
  displayName: Daily npm publish from GitHub Releases
  branches:
    include:
    - main
  always: true

# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
  - repository: polyfillsPipelines
    type: git
    name: open-source/PolyfillsPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    # Update the pool with your team's 1ES hosted pool.
    pool:
      name: OneESPool  # Name of your hosted pool
      image: HostedPoolLinuxImage  # Name of the image in your pool. If not specified, first image of the pool is used
      os: linux  # OS of the image. This value cannot be a variable. Allowed values: windows, linux, macOS
    sdl:
      sourceAnalysisPool:
        name: OneESPool  # Name of your hosted pool
        image: HostedPoolWindowsImage  # Name of the image in your pool. If not specified, first image of the pool is used
        os: windows  # OS of the image. Allowed values: windows, linux, macOS
    settings:
      networkIsolationPolicy: Permissive
      networkIsolationAdditionalDomainAllowList: registry.npmjs.org
    stages:
    - stage: Check
      displayName: Detect undeployed GitHub releases
      jobs:
      - job: CheckVersion
        steps:
          - checkout: self
            persistCredentials: "true"
            fetchTags: true

          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          - script: |
              npm run check-github-releases
            displayName: "Detect releases whose tarballs have not been published"
            name: deploymentCheck
            env:
              GITHUB_REPOSITORY: microsoft/polyfills

    - stage: Package
      displayName: Publish tarballs to npm
      dependsOn: Check
      condition: eq(dependencies.Check.outputs['CheckVersion.deploymentCheck.needsDeployment'], 'true')
      variables:
        undeployedTags: $[ stageDependencies.Check.CheckVersion.outputs['deploymentCheck.undeployedTags'] ]
        focusgroupPolyfillNeedsDeployment: $[ stageDependencies.Check.CheckVersion.outputs['deploymentCheck.focusgroupPolyfillNeedsDeployment'] ]
        focusgroupPolyfillReleaseTag: $[ stageDependencies.Check.CheckVersion.outputs['deploymentCheck.focusgroupPolyfillReleaseTag'] ]
      jobs:
      - job: Deploy
        steps:
          - checkout: self
            persistCredentials: "true"
            fetchTags: true

          - script: |
              git config --global user.email polyfills@microsoft.com
              git config --global user.name "Microsoft Polyfills Builds"
            displayName: "Configure git for tag push"

          - task: DownloadGitHubRelease@0
            displayName: "Download @microsoft/focusgroup-polyfill release assets"
            condition: and(succeeded(), eq(variables['focusgroupPolyfillNeedsDeployment'], 'true'))
            inputs:
              connection: polyfills
              userRepository: microsoft/polyfills
              defaultVersionType: 'specificTag'
              version: '$(focusgroupPolyfillReleaseTag)'
              downloadPath: '$(System.ArtifactsDirectory)'

          - script: |
              set -euo pipefail
              rm -rf publish_artifacts publish_artifacts_meta
              mkdir -p publish_artifacts publish_artifacts_meta

              if find "$(System.ArtifactsDirectory)" -name "*.tgz" -print -quit | grep -q .; then
                find "$(System.ArtifactsDirectory)" -name "*.tgz" -exec cp {} publish_artifacts/ \;
              fi

              printf '%s\n' "$(undeployedTags)" | tr ',' '\n' | sed '/^$/d' > publish_artifacts_meta/undeployed-tags.txt

              if ! find publish_artifacts -maxdepth 1 -type f -print -quit | grep -q .; then
                echo "No GitHub release assets were downloaded."
                exit 1
              fi

              echo "npm artifacts:"
              find publish_artifacts -maxdepth 1 -type f -print | sort

              echo "deployment markers:"
              cat publish_artifacts_meta/undeployed-tags.txt
            displayName: "Prepare release artifacts"

          - template: Polyfills.Release.PipelineTemplate.yml@polyfillsPipelines  # Template reference

          - script: |
              set -euo pipefail
              META_FILE=publish_artifacts_meta/undeployed-tags.txt
              if [ ! -s "$META_FILE" ]; then
                echo "No tags to mark as deployed."
                exit 0
              fi
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                DEPLOY_TAG="deployed/${tag}"
                if git rev-parse --verify --quiet "refs/tags/${DEPLOY_TAG}" >/dev/null; then
                  echo "Already marked deployed: ${DEPLOY_TAG} (skipping)"
                  continue
                fi
                echo "Marking deployed: ${DEPLOY_TAG}"
                git tag "${DEPLOY_TAG}" "refs/tags/${tag}"
                git push origin "${DEPLOY_TAG}"
              done < "$META_FILE"
            displayName: "Mark releases as deployed"
